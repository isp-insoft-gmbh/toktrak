[tools]
dprint = "latest"
google-java-format = "latest"
java = "latest"
markdownlint-cli2 = "latest"
watchexec = "latest"

[tasks.clean]
description = "Remove generated modules, dependencies, argument files, and runtimes"
run = "java -ea tools/Build.java clean"

[tasks.fmt]
description = "Format Markdown and Java sources, optionally limiting Java paths"
raw_args = true
run = ["dprint fmt", "java -ea tools/Build.java fmt"]

[tasks.markdown-check]
hide = true
run = ["dprint check", "markdownlint-cli2"]

[tasks.check]
description = "Check Markdown, formatting, and compile/lint all Java modules"
depends = ["markdown-check"]
run = "java -ea tools/Build.java check"

[tasks.watch-check]
description = "Rerun checks when project files change"
run = "mise watch --restart --watch . -- check"

[tasks.test]
description = "Run tests, optionally limited to test files or directories"
raw_args = true
run = "java -ea tools/Build.java test"

[tasks.watch-test]
description = "Rerun the full cached test suite when Java inputs change"
run = "mise watch --restart --watch sources --watch tests --watch tools --watch vendored --watch mise.toml -- test"

[tasks.pit]
description = "Run PIT options directly; use --history while iterating; source filters follow --"
raw_args = true
run = "java -ea tools/Build.java pit"

[tasks.coverage]
description = "Run tests with JaCoCo and generate HTML, XML, and CSV coverage reports"
run = "java -ea tools/Build.java coverage"

[tasks.refactor]
description = "Apply Refaster rules and format Java sources"
run = "java -ea tools/Build.java refactor"

[tasks.ide]
description = "Generate IDE metadata; choose eclipse or intellij, or omit for both"
raw_args = true
run = "java -ea tools/Build.java ide"

[tasks.verify]
description = "Check Markdown, compile/lint Java, and run the full test suite"
depends = ["markdown-check"]
run = "java -ea tools/Build.java verify"

[tasks.ci]
description = "Check Markdown, apply Refaster, require a clean tree, and verify"
depends = ["markdown-check"]
run = "java -ea tools/Build.java ci"

[tasks.dev]
description = "Run seeded TokTrak and restart when development files change"
usage = 'flag "--fail-writes" help="Start with degraded writes"'
run = "mise watch --restart --watch sources --watch tools --watch tests/corpus/dev.jsonl --watch mise.toml -- dev-server{% if usage.fail_writes %} --fail-writes{% endif %}"

[tasks.dev-server]
hide = true
env = { TOKTRAK_DEV_AUTH = "true" }
run = "java -ea tools/Build.java dev -- --corpus tests/corpus/dev.jsonl"

[tasks.prod]
description = "Build and verify the self-contained production runtime"
run = "java -ea tools/Build.java prod"
