[tools]
coursier = "latest"
google-java-format = "latest"
java = "latest"

[tasks.clean]
description = "Remove generated modules, dependencies, argument files, and runtimes"
run = "java -ea tools/Build.java clean"

[tasks.check]
description = "Resolve dependencies and compile/lint all modules"
run = "java -ea tools/Build.java check"

[tasks.verify]
description = "Compile/lint all modules and run the test suite"
run = "java -ea tools/Build.java verify"

[tasks.dev]
description = "Compile and run TokTrak with the cached development runtime"
run = "java -ea tools/Build.java dev --"

[tasks.prod]
description = "Build and smoke-test the self-contained production runtime"
run = "java -ea tools/Build.java prod"
