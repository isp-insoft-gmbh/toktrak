min_version = "2026.9.18"

[tool_alias]
hyperfine = "github:sharkdp/hyperfine"

[tools]
dprint = "latest"
google-java-format = "latest"
java = "temurin"
node = "latest"
oxlint = "latest"
rumdl = "latest"

[tools.hyperfine]
version = "latest"

[tool_config]
locked = true

[settings]
lockfile_platforms = ["linux-x64", "macos-arm64", "windows-x64"]

# Main read-only ladder: each gate includes the guarantees above it.
[tasks.check]
description = "Base gate: formatting, definitions, compilation, and static analysis"
run = "java -ea tools/Build.java check"

[tasks.test]
description = "Check plus core tests; --only runs selected tests without check"
usage = '''
flag "--only" help="Run selected paths without repository-wide checks"
arg "[paths]" var=#true help="Test files or directories; requires --only"
'''
# Parsed paths use Base64 to cross both POSIX sh and Windows cmd without shell expansion.
run = "java -ea tools/Build.java test --mise-usage{% if usage.only %} --only{% endif %}{% for path in usage.paths %} p:{{ path | b64_encode }}{% endfor %}"

[tasks.verify]
description = "Check, core tests, and linked production runtime verification"
run = "java -ea tools/Build.java verify"

[tasks.ci]
description = "Clean-tree gate: check, Refaster, tests, runtime, and coverage floors"
run = "java -ea tools/Build.java ci"

# Local authoring.
[tasks.dev]
description = "Run seeded TokTrak until stopped; restart manually after edits"
usage = 'flag "--fail-writes" help="Start with degraded writes"'
env = { TOKTRAK_DEV_AUTH = "true" }
run = "java -ea tools/Build.java dev -- --corpus tests/corpus/dev.jsonl{% if usage.fail_writes %} --fail-writes{% endif %}"

[tasks.fmt]
description = "Format Markdown and Java sources, optionally limiting Java paths"
raw_args = true
run = "java -ea tools/Build.java fmt"

# Focused quality and developer utilities.
[tasks.refactor]
description = "Apply Refaster rewrites; --check validates without edits (also in ci)"
usage = 'flag "--check" help="Validate Refaster conformance without editing"'
run = "java -ea tools/Build.java refactor{% if usage.check %} --check{% endif %}"

[tasks.coverage]
description = "Run JaCoCo tests, generate reports, and enforce floors (also in ci)"
run = "java -ea tools/Build.java coverage"

[tasks.pit]
description = "Run PIT options directly; use --history while iterating; source filters follow --"
raw_args = true
run = "java -ea tools/Build.java pit"

[tasks.perf]
description = "Run observational performance benchmarks and write output/perf artifacts"
raw_args = true
run = "java -ea tools/Build.java perf"

[tasks.ide]
description = "Generate IDE metadata; choose eclipse or intellij, or omit for both"
raw_args = true
run = "java -ea tools/Build.java ide"

[tasks.clean]
description = "Delete disposable output"
run = "java -ea tools/Build.java clean"

# Focused tracker tests and golem workflows.
[tasks.tracker-test]
description = "Run tracker and scheduler tests through Build.java (also in test, verify, and ci)"
run = "java -ea tools/Build.java test --only tests/tracker"

[task_templates.golem-tools]
tools = { "aqua:earendil-works/pi" = "latest", "aqua:anthropics/claude-code" = "latest", "aqua:openai/codex" = "latest" }

[tasks.golem-auth-check]
extends = "golem-tools"
description = "Probe live harness authentication; separate from repository checks"
raw_args = true
run = "java -ea tools/Build.java golem-auth-check"

[tasks.golem]
extends = "golem-tools"
description = "Run one complete local golem lifecycle"
raw_args = true
run = "java -ea tools/Build.java golem"

# Production packaging and release.
[tasks.runtime-build]
description = "Build and verify the self-contained production runtime"
run = "java -ea tools/Build.java prod"

[tasks.container-build]
description = "Build and inspect the immutable TokTrak container image"
run = "java -ea tools/Build.java image"

[tasks.container-verify]
description = "Verify the image with rootless Podman; separate from core verify"
run = "java -ea tools/Build.java container-verify"
run_windows = "set CONTAINER_CONNECTION=podman-machine-default&& java -ea tools/Build.java container-verify"

[tasks.release]
description = "Verify and publish the next immutable integer release"
raw_args = true
run = "java -ea tools/Build.java release"
run_windows = "set CONTAINER_CONNECTION=podman-machine-default&& java -ea tools/Build.java release"
