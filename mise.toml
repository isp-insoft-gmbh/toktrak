min_version = "2026.9.1"

[tools]
dprint = "0.57.0"
google-java-format = "1.36.1"
hyperfine = "1.20.0"
java = "temurin-26.0.2+10"
node = "26.8.1"
oxlint = "1.80.0"
markdownlint-cli2 = "0.23.2"
watchexec = "2.7.1"

[tasks.clean]
description = "Delete disposable output"
run = "java -ea tools/Build.java clean"

[tasks.fmt]
description = "Format Markdown and Java sources, optionally limiting Java paths"
raw_args = true
run = ["dprint fmt", "java -ea tools/Build.java fmt"]

[tasks.markdown-check]
hide = true
run = ["dprint check", "markdownlint-cli2"]

[tasks.tracker-lint]
description = "Lint the tracker and tracker tests"
run = "oxlint sources/toktrak/assets/private/tracker.mjs tests/tracker"

[tasks.check]
description = "Check Markdown, tracker JavaScript, and compile/lint all Java modules"
depends = ["markdown-check", "tracker-lint"]
run = "java -ea tools/Build.java check"

[tasks.watch-check]
description = "Rerun checks when project files change"
run = "mise watch --restart --watch . -- check"

[tasks.golem-check]
description = "Validate golem definition files"
run = "node tools/golem.mjs check"

[tasks.golem-auth-check]
description = "Authenticate one configured task or one task per harness"
raw_args = true
run = "node tools/golem.mjs auth-check"

[tasks.golem]
description = "Run one complete local golem lifecycle"
raw_args = true
run = "node tools/golem.mjs run"

[tasks.test]
description = "Run tests, optionally limited to test files or directories"
raw_args = true
run = "java -ea tools/Build.java test"

[tasks.tracker-test]
description = "Run tracker unit and native scheduler integration tests"
run = 'node --test "tests/tracker/**/*.test.mjs"'

[tasks.watch-test]
description = "Rerun the full cached test suite when Java inputs change"
run = "mise watch --restart --watch sources --watch tests --watch tools --watch vendored --watch mise.toml -- test"

[tasks.pit]
description = "Run PIT options directly; use --history while iterating; source filters follow --"
raw_args = true
run = "java -ea tools/Build.java pit"

[tasks.perf]
description = "Run observational performance benchmarks and write output/perf artifacts"
raw_args = true
run = "java -ea tools/Build.java perf"

[tasks.coverage]
description = "Run tests with JaCoCo and generate HTML, XML, and CSV coverage reports"
run = "java -ea tools/Build.java coverage"

[tasks.refactor]
description = "Apply Refaster rules and format Java sources"
run = "java -ea tools/Build.java refactor"

[tasks.ide]
description = "Generate IDE metadata; choose eclipse or intellij, or omit for both"
raw_args = true
run = "java -ea tools/Build.java ide"

[tasks.verify]
description = "Check Markdown and code, then run the full test suite"
depends = ["markdown-check", "tracker-lint"]
run = "java -ea tools/Build.java verify"

[tasks.ci]
description = "Check Markdown and tracker JavaScript, apply Refaster, require a clean tree, and verify"
depends = ["markdown-check", "tracker-lint"]
run = "java -ea tools/Build.java ci"

[tasks.dev]
description = "Run seeded TokTrak and restart when development files change"
usage = 'flag "--fail-writes" help="Start with degraded writes"'
run = "mise watch --restart --watch sources --watch tools --watch tests/corpus/dev.jsonl --watch mise.toml -- dev-server{% if usage.fail_writes %} --fail-writes{% endif %}"

[tasks.dev-server]
hide = true
env = { TOKTRAK_DEV_AUTH = "true" }
run = "java -ea tools/Build.java dev -- --corpus tests/corpus/dev.jsonl"

[tasks.prod]
description = "Build and verify the self-contained production runtime"
run = "java -ea tools/Build.java prod"

[tasks.image]
description = "Build and inspect the immutable TokTrak container image"
run = "java -ea tools/Build.java image"

[tasks.container-verify]
description = "Build and verify the image with rootless Podman"
run = "java -ea tools/Build.java container-verify"
run_windows = "set CONTAINER_CONNECTION=podman-machine-default&& java -ea tools/Build.java container-verify"

[tasks.release]
description = "Verify and publish the next immutable integer release"
raw_args = true
run = "java -ea tools/Build.java release"
run_windows = "set CONTAINER_CONNECTION=podman-machine-default&& java -ea tools/Build.java release"
