name: Tracker integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker:
    name: tracker (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
          - platform: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.10.0
          install_args: node java
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run tracker-test
