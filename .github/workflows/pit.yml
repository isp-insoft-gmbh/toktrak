name: Mutation tests

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.18
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/pit.history
          key: pit-history-v2-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pit-history-v2-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}-
      - if: github.event_name == 'pull_request'
        run: mise run pit
      - if: github.event_name != 'pull_request'
        run: mise run pit --history
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/pit.history
          key: pit-history-v2-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload mutation report
        id: mutation-artifact
        if: always() && github.event_name != 'pull_request' && hashFiles('output/mutations/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report
          path: output/mutations
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Summarize mutation report
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.mutation-artifact.outcome }}
        run: |
          {
            echo "## PIT mutation tests"
            echo
            if [[ -f output/mutations/mutations.xml ]]; then
              for status in KILLED SURVIVED NO_COVERAGE; do
                count=$(grep -o "status=\"$status\"" output/mutations/mutations.xml | wc -l) || true
                echo "- $status: $count"
              done
            else
              echo "No mutation report was generated; inspect the job log."
            fi
            if [[ "$ARTIFACT_OUTCOME" == "success" ]]; then
              echo "Download the \`mutation-report\` artifact and open \`index.html\`."
            elif [[ "$ARTIFACT_OUTCOME" == "failure" ]]; then
              echo "> [!WARNING]"
              echo "> Mutation report upload failed; PIT's result remains authoritative."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ARTIFACT_OUTCOME" == "failure" ]]; then
            echo "::warning::The downloadable mutation report could not be uploaded."
          fi
