name: Mutation tests

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pit
  cancel-in-progress: false

jobs:
  pit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.8
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/pit.history
          key: pit-history-v1-${{ runner.os }}-java26-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pit-history-v1-${{ runner.os }}-java26-
      - run: mise run pit --history
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/pit.history
          key: pit-history-v1-${{ runner.os }}-java26-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        run: |
          {
            echo "## PIT mutation tests"
            echo
            echo "Download the \`mutation-report\` artifact and open \`index.html\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('output/mutations/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report
          path: output/mutations
          if-no-files-found: error
          overwrite: true
          retention-days: 14
