name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.18
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run ci
      - name: Upload coverage report
        id: coverage-artifact
        if: always() && hashFiles('output/coverage/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: output/coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Report unavailable coverage artifact
        if: always() && steps.coverage-artifact.outcome == 'failure'
        run: |
          echo "::warning::The downloadable coverage report could not be uploaded."
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> Coverage report upload failed. Validation results above remain authoritative." >> "$GITHUB_STEP_SUMMARY"

  tracker:
    uses: ./.github/workflows/tracker.yml

  ci:
    needs: [core, tracker]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 1
    steps:
      - name: Require core and cross-platform tracker tests
        env:
          CORE_RESULT: ${{ needs.core.result }}
          TRACKER_RESULT: ${{ needs.tracker.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$TRACKER_RESULT" = success
