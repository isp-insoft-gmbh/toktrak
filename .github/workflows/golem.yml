name: Golems
run-name: "Golems: ${{ inputs.operation || 'schedule' }} · ${{ inputs.task || 'due tasks' }}"

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Run one task or reseed one rotating subscription
        required: true
        default: run
        type: choice
        options:
          - run
          - reseed-pi
          - reseed-codex
      task:
        description: Task ID used by the run operation
        required: true
        default: bugs
        type: string

permissions:
  contents: read

concurrency:
  group: golems
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      has-tasks: ${{ steps.selection.outputs.has-tasks }}
      tasks: ${{ steps.selection.outputs.tasks }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Golem workflows run only from $DEFAULT_BRANCH" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.10.0
          install_args: java
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - id: selection
        env:
          OPERATION: ${{ inputs.operation || 'run' }}
          TASK: ${{ inputs.task }}
          CUTOVER: ${{ vars.GOLEM_JAVA_CUTOVER }}
        run: |
          if [[ "$OPERATION" != "run" ]]; then
            tasks='[]'
          elif [[ "$CUTOVER" != "enabled" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo 'Java Golem schedule paused until the manual canary is reviewed.'
            tasks='[]'
          elif [[ "$CUTOVER" != "enabled" && "$TASK" != "canary" ]]; then
            echo 'Only the canary may run before GOLEM_JAVA_CUTOVER is enabled.' >&2
            exit 1
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            java -ea tools/golems/Golems.java select --event workflow_dispatch --golem "$TASK" | tee /tmp/golem-select.txt
            tasks="$(tail -n 1 /tmp/golem-select.txt)"
          else
            java -ea tools/golems/Golems.java select --event schedule | tee /tmp/golem-select.txt
            tasks="$(tail -n 1 /tmp/golem-select.txt)"
          fi
          if [[ "$tasks" == '[]' ]]; then
            echo "has-tasks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-tasks=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          {
            echo "## Golem dispatch"
            echo
            echo "Operation: \`$OPERATION\`"
            echo
            echo "Selection: \`$tasks\`"
          } >> "$GITHUB_STEP_SUMMARY"

  golem:
    needs: select
    if: needs.select.outputs.has-tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.tasks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - if: matrix.golem != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - if: matrix.golem != ''
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.10.0
          install_args: --include-task-tools
          cache_key: mise-v2-task-tools-{{platform}}-{{version}}-{{file_hash}}
      - name: Validate runner tools
        if: matrix.golem != ''
        id: tools
        run: |
          gh_version="$(gh --version | head -n 1 | awk '{print $3}')"
          [[ "$(printf '%s\n' 2.70.0 "$gh_version" | sort -V | head -n 1)" == "2.70.0" ]]
          echo "gh-version=$gh_version" >> "$GITHUB_OUTPUT"
      - name: Mint repository GitHub App token
        if: matrix.golem != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TOKTRAK_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOKTRAK_AGENT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
          permission-statuses: read
      - name: Configure bot Git identity
        if: matrix.golem != ''
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot="$APP_SLUG[bot]"
          user_id="$(gh api "/users/$bot" --jq .id)"
          git config --global user.name "$bot"
          git config --global user.email "$user_id+$bot@users.noreply.github.com"
          gh auth setup-git
      - name: Restore encrypted rotating authentication
        if: matrix.harness == 'pi' || matrix.harness == 'codex'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/golem-auth/${{ matrix.harness }}.bin
          key: golem-auth-v1-${{ matrix.harness }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: golem-auth-v1-${{ matrix.harness }}-
          fail-on-cache-miss: true
      - name: Decrypt rotating authentication
        if: matrix.harness == 'pi' || matrix.harness == 'codex'
        env:
          GOLEM_AUTH_CACHE_KEY: ${{ secrets.GOLEM_AUTH_CACHE_KEY }}
        run: java -ea tools/golems/Auth.java decrypt "${{ matrix.harness }}" "output/golem-auth/${{ matrix.harness }}.bin"
      - name: Run local golem lifecycle
        if: matrix.golem != ''
        id: lifecycle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.harness == 'claude' && secrets.GOLEM_CLAUDE_OAUTH_TOKEN || '' }}
          GATEBRIDGE_R2_ACCESS_KEY_ID: ${{ secrets.GATEBRIDGE_R2_ACCESS_KEY_ID }}
          GATEBRIDGE_R2_ENDPOINT: ${{ secrets.GATEBRIDGE_R2_ENDPOINT }}
          GATEBRIDGE_R2_SECRET_ACCESS_KEY: ${{ secrets.GATEBRIDGE_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # mise run activates task-scoped Pi, Codex, and Claude binaries for the child JVM.
        run: mise run golem "${{ matrix.golem }}"
      - name: Encrypt rotated authentication
        if: always() && (matrix.harness == 'pi' || matrix.harness == 'codex')
        id: encrypt
        env:
          GOLEM_AUTH_CACHE_KEY: ${{ secrets.GOLEM_AUTH_CACHE_KEY }}
        run: java -ea tools/golems/Auth.java encrypt "${{ matrix.harness }}" "output/golem-auth/${{ matrix.harness }}.bin"
      - name: Save rotated authentication
        id: save-auth
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/golem-auth/${{ matrix.harness }}.bin
          key: golem-auth-v1-${{ matrix.harness }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize golem result
        if: always() && matrix.golem != ''
        env:
          GH_VERSION: ${{ steps.tools.outputs.gh-version }}
          RESULT: ${{ steps.lifecycle.outcome }}
          AUTH_SAVED: ${{ steps.save-auth.outcome }}
        run: |
          {
            echo "## Golem ${{ matrix.golem }}"
            echo
            echo "- Publication lifecycle: \`$RESULT\`"
            echo "- PR CI: independent; inspect the PR checks before manual merge."
            if [[ "${{ matrix.harness }}" == pi || "${{ matrix.harness }}" == codex ]]; then
              echo "- Rotating auth saved: \`$AUTH_SAVED\`"
            fi
            echo "- Harness: \`${{ matrix.harness }}\`"
            echo "- Model: \`${{ matrix.model }}\`"
            echo "- Effort: \`${{ matrix.effort }}\`"
            echo "- gh: \`$GH_VERSION\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  reseed:
    needs: select
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.operation, 'reseed-')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      HARNESS: ${{ inputs.operation == 'reseed-pi' && 'pi' || 'codex' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.10.0
          install_args: --include-task-tools
          cache_key: mise-v2-task-tools-{{platform}}-{{version}}-{{file_hash}}
      - name: Restore fresh seed
        env:
          GOLEM_AUTH_SEED: ${{ inputs.operation == 'reseed-pi' && secrets.GOLEM_PI_AUTH_SEED || secrets.GOLEM_CODEX_AUTH_SEED }}
        run: java -ea tools/golems/Auth.java seed "$HARNESS"
      - name: Verify fresh subscription authentication
        run: |
          if [[ "$HARNESS" == "pi" ]]; then
            mise run golem-auth-check bugs
          else
            mise run golem-auth-check security
          fi
      - name: Encrypt fresh authentication baseline
        env:
          GOLEM_AUTH_CACHE_KEY: ${{ secrets.GOLEM_AUTH_CACHE_KEY }}
        run: java -ea tools/golems/Auth.java encrypt "$HARNESS" "output/golem-auth/$HARNESS.bin"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: output/golem-auth/${{ env.HARNESS }}.bin
          key: golem-auth-v1-${{ env.HARNESS }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: |
          {
            echo "## Golem authentication reseed"
            echo
            echo "Stored a verified encrypted \`$HARNESS\` baseline. No golem ran."
          } >> "$GITHUB_STEP_SUMMARY"
