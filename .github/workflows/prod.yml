name: Production runtime verification

on:
  push:
    branches: [trunk]
    paths:
      - .containerignore
      - .github/workflows/prod.yml
      - .github/workflows/release.yml
      - CHANGELOG.md
      - Containerfile
      - mise.toml
      - mise.lock
      - .mise/locks/**
      - sources/**
      - tools/**
      - vendored/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.10.1
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - name: Generate development release notes
        run: node tools/release-notes.mjs dev output/release/CHANGELOG.md
      - name: Build and verify development image
        run: node tools/container-ci.mjs verify dev
