name: Production runtime verification

on:
  push:
    branches: [trunk]
    paths:
      - .containerignore
      - .github/workflows/prod.yml
      - Containerfile
      - mise.toml
      - mise.lock
      - .mise/locks/**
      - sources/**
      - tools/**
      - vendored/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOKTRAK_IMAGE_REPOSITORY: localhost/toktrak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.10.0
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run runtime-build
      - run: mise run container-verify
