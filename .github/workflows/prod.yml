name: Production runtime verification

on:
  push:
    branches: [trunk]
    paths:
      - .containerignore
      - .github/workflows/prod.yml
      - Containerfile
      - mise.toml
      - sources/**
      - tools/**
      - vendored/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TOKTRAK_IMAGE_REPOSITORY: localhost/toktrak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.14
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run prod
      - run: mise run container-verify
