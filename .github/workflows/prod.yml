name: Production runtime verification

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TOKTRAK_IMAGE_REPOSITORY: localhost/toktrak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - run: mise run prod
      - run: mise run image
      - run: mise run container-verify
