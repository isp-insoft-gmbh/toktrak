name: Performance

on:
  push:
    branches: [trunk]
    paths:
      - .github/workflows/perf.yml
      - .containerignore
      - Containerfile
      - mise.toml
      - mise.lock
      - .mise/locks/**
      - sources/**
      - tests/corpus/**
      - tools/**
      - vendored/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PERF_RUNNER_LABEL: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: 2026.9.18
          install_args: java node hyperfine
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run perf
      - name: Upload performance report
        id: performance-artifact
        if: always() && github.event_name != 'pull_request' && hashFiles('output/perf/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/perf
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Report unavailable performance artifact
        if: always() && steps.performance-artifact.outcome == 'failure'
        run: |
          echo "::warning::The downloadable performance report could not be uploaded."
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> Performance report upload failed. Results above remain authoritative." >> "$GITHUB_STEP_SUMMARY"
