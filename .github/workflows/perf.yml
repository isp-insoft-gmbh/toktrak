name: Performance

on:
  push:
    branches: [trunk]
    paths:
      - .github/workflows/perf.yml
      - .containerignore
      - Containerfile
      - mise.toml
      - sources/**
      - tests/corpus/**
      - tools/**
      - vendored/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      PERF_RUNNER_LABEL: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.8
          install_args: java node hyperfine
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run perf
      - if: always() && hashFiles('output/perf/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/perf
          if-no-files-found: error
          overwrite: true
          retention-days: 30
