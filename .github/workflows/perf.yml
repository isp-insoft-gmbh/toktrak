name: Performance

on:
  push:
    branches: [trunk]
    paths:
      - .github/workflows/perf.yml
      - .containerignore
      - Containerfile
      - mise.toml
      - sources/**
      - tests/corpus/**
      - tools/**
      - vendored/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      PERF_RUNNER_LABEL: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: java node hyperfine
          cache_key: mise-v2-{{platform}}-{{version}}-{{install_args_hash}}-{{file_hash}}
      - run: mise run perf
      - name: Upload performance report
        id: performance-artifact
        if: always() && hashFiles('output/perf/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/perf
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Report unavailable performance artifact
        if: always() && steps.performance-artifact.outcome == 'failure'
        run: |
          echo "::warning::The downloadable performance report could not be uploaded."
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> Performance report upload failed. Results above remain authoritative." >> "$GITHUB_STEP_SUMMARY"
